<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8"><title>Aardrijkskunde Game</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #10b981; border-radius: 20px; max-width: 600px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(16, 185, 129, 0.3); }
        .btn { background: #111122; color: white; border: 2px solid #2a2a4a; padding: 15px; border-radius: 10px; cursor: pointer; margin: 10px; width: 40%; font-size: 1rem; }
        .btn:hover { border-color: #10b981; }
    </style>
</head>
<body>
    <a href="index.html" style="color: #6b7280; text-decoration: none;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>The 3 P's Sorter 🌱</h2>
        <p id="scenario" style="font-size: 1.2rem; margin: 25px 0; font-weight: bold;"></p>
        <button class="btn" onclick="check('People')">👥 People</button>
        <button class="btn" onclick="check('Planet')">🌍 Planet</button>
        <button class="btn" onclick="check('Prosperity')">💰 Prosperity</button>
        <button class="btn" onclick="check('Niet')">🛑 Niet Duurzaam</button>
        <h3 id="feedback" style="margin-top: 20px;"></h3>
    </div>
    <script>
        const data = [
            { t: "Een fabriek zuivert al haar afvalwater voordat het de rivier in stroomt.", c: "Planet" },
            { t: "Zorgen voor eerlijke lonen en veilige werkplekken voor arbeiders.", c: "People" },
            { t: "Een fabriek dumpt chemisch afval in het bos om geld te besparen.", c: "Niet" }
        ];
        let cur;
        function load() { document.getElementById('feedback').innerText = ""; cur = data[Math.floor(Math.random() * data.length)]; document.getElementById('scenario').innerText = cur.t; }
        function check(choice) {
            let fb = document.getElementById('feedback');
            if(choice === cur.c) { fb.innerText = "Juist gecategoriseerd! 🌍"; fb.style.color = "#10b981"; }
            else { fb.innerText = "Onjuist! ❌"; fb.style.color = "#ef4444"; }
            setTimeout(load, 1500);
        }
        load();
    </script>
</body>
</html>
<script type="module" src="firebase-config.js"></script>
