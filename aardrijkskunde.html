<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8"><title>Aardrijkskunde Game</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #10b981; border-radius: 20px; max-width: 650px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(16, 185, 129, 0.3); }
        .btn { background: #111122; color: white; border: 2px solid #2a2a4a; padding: 15px; border-radius: 10px; cursor: pointer; margin: 10px; width: 40%; font-size: 1rem; }
        .btn:hover { border-color: #10b981; }
    </style>
</head>
<body onload="load()">
    <a href="index.html" style="color: #6b7280; text-decoration: none;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>The 3 P's Sorter 🌱</h2>
        <p style="color: #6b7280;">Lokale Score: <span id="score">0</span> pts</p>
        <p id="scenario" style="font-size: 1.2rem; margin: 25px 0; font-weight: bold; min-height: 60px;"></p>
        <button class="btn-choice btn" onclick="check('People')">👥 People</button>
        <button class="btn-choice btn" onclick="check('Planet')">🌍 Planet</button>
        <button class="btn-choice btn" onclick="check('Prosperity')">💰 Prosperity</button>
        <button class="btn-choice btn" onclick="check('Niet')">🛑 Niet Duurzaam</button>
        <h3 id="feedback" style="margin-top: 20px; min-height: 30px;"></h3>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script>
        const data = [
            { t: "Een fabriek zuivert al haar afvalwater voordat het de rivier in stroomt.", c: "Planet" },
            { t: "Zorgen voor eerlijke lonen en veilige werkplekken voor arbeiders.", c: "People" },
            { t: "Een fabriek dumpt chemisch afval in het bos om geld te besparen.", c: "Niet" },
            { t: "Investeren in zonnepanelen en windenergie om CO2-uitstoot te verlagen.", c: "Planet" },
            { t: "Het bouwen van moderne scholen en ziekenhuizen in arme wijken.", c: "People" },
            { t: "Een bedrijf maakt winst door te innoveren in herbruikbare verpakkingen.", c: "Prosperity" },
            { t: "Kinderarbeid inzetten op plantages om goedkope grondstoffen te oogsten.", c: "Niet" },
            { t: "Het beschermen van bedreigde diersoorten en hun natuurlijke leefomgeving.", c: "Planet" },
            { t: "Gelijke kansen en lonen bieden aan mannen en vrouwen op de werkvloer.", c: "People" },
            { t: "Lokale boeren steunen zodat de economie in de regio zelfstandig kan groeien.", c: "Prosperity" },
            { t: "Regenwoud grootschalig kappen om niet-duurzame palmolieplantages aan te leggen.", c: "Niet" },
            { t: "Grondstoffen maximaal hergebruiken in een gesloten, circulaire economie.", c: "Prosperity" },
            { t: "Plastic afval rechtstreeks in de oceaan of rivieren dumpen.", c: "Niet" }
        ];
        let cur;
        let localScore = 0;

        function load() { 
            document.getElementById('feedback').innerText = ""; 
            const btns = document.querySelectorAll('.btn-choice');
            btns.forEach(b => { b.style.pointerEvents = 'auto'; b.style.opacity = '1'; });
            
            cur = data[Math.floor(Math.random() * data.length)]; 
            document.getElementById('scenario').innerText = cur.t; 
        }

        function check(choice) {
            const btns = document.querySelectorAll('.btn-choice');
            btns.forEach(b => { b.style.pointerEvents = 'none'; b.style.opacity = '0.5'; });

            let fb = document.getElementById('feedback');
            if(choice === cur.c) { 
                fb.innerText = "Juist gecategoriseerd! 🌍 +10 pts"; 
                fb.style.color = "#10b981"; 
                localScore += 10;
                document.getElementById('score').innerText = localScore;
                if(window.saveScoreToCloud) window.saveScoreToCloud(10);
                setTimeout(load, 2000);
            } else {
                fb.innerText = "Oeps! Dat klopt helaas niet. ❌ -10 pts"; 
                fb.style.color = "#ef4444";
                localScore = Math.max(0, localScore - 10);
                document.getElementById('score').innerText = localScore;
                if(window.saveScoreToCloud) window.saveScoreToCloud(-10);
                setTimeout(load, 2000);
            }
        }
    </script>
</body>
</html>
