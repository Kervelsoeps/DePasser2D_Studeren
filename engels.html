<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Engels Game - Volledige Examenstof</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #ef4444; border-radius: 20px; max-width: 750px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(239, 68, 68, 0.3); }
        .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 16px; border-radius: 14px; cursor: pointer; color: white; font-size: 1.05rem; text-align: left; }
        .box:hover { border-color: #ef4444; background: #1c1c38; }
        .badge { background: #ef4444; color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>
    <a href="index.html" style="color: #6b7280; text-decoration: none; font-weight: bold;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>Grammar & Functional Language Runner 🇬🇧</h2>
        <p>Answer the question based on New Strike 2.2 (Units 3-7):</p>
        <h3 id="topic" style="color: #9ca3af; margin-top: 10px;"></h3>
        <h1 id="target" style="font-size: 1.25rem; font-weight: bold; margin: 15px 0; color: #ef4444;"></h1>
        <div class="grid" id="choices"></div>
        <h3 id="feedback" style="margin-top: 20px;"></h3>
    </div>

    <script>
        const data = [
            { t: "Unit 3: Ordinal numbers", q: "How do you write the ordinal number for 22?", a: "twenty-second (22nd)", f: ["twenty-twoth (22th)", "twenty-secondth (22rd)"] },
            { t: "Unit 3: Present Continuous", q: "Complete the personal arrangement: 'We _______ (have) a big birthday party tomorrow night.'", a: "are having", f: ["have", "will have"] },
            { t: "Unit 3: Functional Language", q: "What is the correct way to write down the date '3 June'?", a: "June 3rd / 3 June", f: ["June 3th / 3th June", "June 3rd / 3rd June"] },
            { t: "Unit 3: Informal call", q: "How do you answer the phone informally when a friend calls?", a: "Hi, this is Tom speaking. Is that you, Sam?", f: ["Good morning, company ABC, how can I help you?", "Who are you and why do you call?"] },
            { t: "Unit 4/6: Giving directions", q: "How do you say: 'Rijd rechtdoor tot aan het rondpunt en neem de tweede afslag'?", a: "Go straight ahead until the roundabout and take the second exit.", f: ["Turn left at the traffic lights and go back.", "Walk past the crossroads and stop there."] },
            { t: "Unit 5: Grammar / Present Tenses", q: "Choose the correct verb form for a permanent state: 'My uncle _______ (live) in London.'", a: "lives", f: ["is living", "live"] }
        ];
        let cur;

        function load() {
            document.getElementById('feedback').innerText = "";
            document.getElementById('choices').innerHTML = "";
            cur = data[Math.floor(Math.random() * data.length)];
            document.getElementById('topic').innerHTML = `Onderdeel: <span class="badge">${cur.t}</span>`;
            document.getElementById('target').innerText = cur.q;

            let options = [cur.a, ...cur.f].sort(() => Math.random() - 0.5);
            options.forEach(c => {
                let d = document.createElement('button');
                d.className = 'box';
                d.innerText = c;
                d.onclick = () => {
                    let fb = document.getElementById('feedback');
                    if(c === cur.a) { 
                        fb.innerText = "Awesome! +15 pts"; 
                        fb.style.color = "#10b981"; 
                        if(window.saveScoreToCloud) { window.saveScoreToCloud(15); }
                        setTimeout(load, 1500);
                    } else { 
                        fb.innerText = "Wrong answer! Check your New Strike workbook or Quizlet."; 
                        fb.style.color = "#ef4444"; 
                    }
                };
                document.getElementById('choices').appendChild(d);
            });
        }
        load();
    </script>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
