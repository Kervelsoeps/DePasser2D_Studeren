<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8"><title>Engels Game</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; background-image: radial-gradient(#1e1b4b, #0a0a12); }
        .arcade { background: #141423; border: 3px solid #ef4444; border-radius: 20px; max-width: 600px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(239, 68, 68, 0.3); }
        .btn { background: linear-gradient(135deg, #ef4444, #991b1b); color: white; border: none; padding: 14px 28px; border-radius: 12px; font-weight: bold; cursor: pointer; margin: 10px; font-size: 1.1rem;}
        .back-btn { display: inline-block; margin-bottom: 20px; color: #9ca3af; text-decoration: none; }
    </style>
</head>
<body onload="load()">
    <a href="index.html" class="back-btn">⬅ Terug naar Menu</a>
    <div class="arcade">
        <h2>Grammar Runner 🏃‍♂️</h2>
        <p style="color: #6b7280;">Lokale Score: <span id="score">0</span> pts</p>
        <h3 id="quest" style="margin: 20px 0; font-size: 1.4rem;"></h3>
        <button class="btn" onclick="answer('optA')" id="optA"></button>
        <button class="btn" onclick="answer('optB')" id="optB"></button>
        <h3 id="feedback" style="margin-top: 20px;"></h3>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script>
        let idx = 0;
        let localScore = 0;
        const data = [
            { q: "We ___ (have) a barbecue tomorrow night! (Arrangement)", a: "are having", b: "have", correct: "are having" },
            { q: "Hoe schrijf je 3 juni correct?", a: "June 3rd", b: "June 3th", correct: "June 3rd" },
            { q: "I ___ (meet) my friends at 8 PM.", a: "am meeting", b: "meet", correct: "am meeting" }
        ];

        function load() {
            if(idx >= data.length) { 
                document.getElementById('quest').innerText = "🎮 Level Voltooid!"; 
                document.getElementById('optA').style.display = "none";
                document.getElementById('optB').style.display = "none";
                return; 
            }
            document.getElementById('quest').innerText = data[idx].q;
            document.getElementById('optA').innerText = data[idx].a;
            document.getElementById('optB').innerText = data[idx].b;
            document.getElementById('feedback').innerText = "";
        }

        function answer(elementId) {
            let choice = document.getElementById(elementId).innerText;
            let fb = document.getElementById('feedback');
            
            if(choice === data[idx].correct) { 
                fb.innerText = "Correct! ✨ +10 pts"; 
                fb.style.color = "#10b981"; 
                localScore += 10;
                document.getElementById('score').innerText = localScore;
                
                if(window.saveScoreToCloud) {
                    window.saveScoreToCloud(10);
                }
                idx++;
                setTimeout(load, 2000);
            } else {
                fb.innerText = "Helaas, fout antwoord! ❌"; 
                fb.style.color = "#ef4444";
                idx++;
                setTimeout(load, 2000);
            }
        }
    </script>
</body>
</html>
