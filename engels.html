<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8"><title>Engels Game</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; background-image: radial-gradient(#1e1b4b, #0a0a12); }
        .arcade { background: #141423; border: 3px solid #ef4444; border-radius: 20px; max-width: 650px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(239, 68, 68, 0.3); }
        .btn { background: linear-gradient(135deg, #ef4444, #991b1b); color: white; border: none; padding: 14px 28px; border-radius: 12px; font-weight: bold; cursor: pointer; margin: 10px; font-size: 1.1rem;}
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #9ca3af; text-decoration: none; }
    </style>
</head>
<body onload="load()">
    <a href="index.html" class="back-btn">⬅ Terug naar Menu</a>
    <div class="arcade">
        <h2>Grammar Runner 🏃‍♂️</h2>
        <p style="color: #6b7280;">Lokale Score: <span id="score">0</span> pts</p>
        <h3 id="quest" style="margin: 20px 0; font-size: 1.4rem; min-height: 60px;"></h3>
        <button class="btn" onclick="answer('optA')" id="optA"></button>
        <button class="btn" onclick="answer('optB')" id="optB"></button>
        <h3 id="feedback" style="margin-top: 20px; min-height: 30px;"></h3>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script>
        let idx = 0;
        let localScore = 0;
        const data = [
            { q: "We ___ (have) a barbecue tomorrow night! (Arrangement)", a: "are having", b: "have", correct: "are having" },
            { q: "Hoe schrijf je 3 juni correct?", a: "June 3rd", b: "June 3th", correct: "June 3rd" },
            { q: "I ___ (meet) my friends at 8 PM tonight.", a: "meet", b: "am meeting", correct: "am meeting" },
            { q: "How ___ apples do you want?", a: "much", b: "many", correct: "many" },
            { q: "There isn't ___ milk left in the fridge.", a: "much", b: "many", correct: "much" },
            { q: "I eat ___ vegetables every day.", a: "a lot of", b: "much", correct: "a lot of" },
            { q: "How ___ sugar do you put in your tea?", a: "much", b: "many", correct: "much" },
            { q: "Healthy food is ___ than fast food.", a: "better", b: "gooder", correct: "better" },
            { q: "Skipping breakfast is the ___ start to the day.", a: "worse", b: "worst", correct: "worst" },
            { q: "An apple is ___ than a biscuit.", a: "healthier", b: "more healthy", correct: "healthier" },
            { q: "Yesterday, I ___ (be) at school.", a: "was", b: "were", correct: "was" },
            { q: "They ___ (be) very happy to see us last week.", a: "was", b: "were", correct: "were" },
            { q: "We ___ (go) to London last summer.", a: "went", b: "goed", correct: "went" },
            { q: "He ___ (buy) a new game two days ago.", a: "bought", b: "buyed", correct: "bought" },
            { q: "___ you see your friend yesterday afternoon?", a: "Did", b: "Do", correct: "Did" }
        ];

        // Schud de vragenlijst bij de start
        data.sort(() => Math.random() - 0.5);

        function load() {
            if(idx >= data.length) { 
                document.getElementById('quest').innerText = "🎮 Level Voltooid!"; 
                document.getElementById('optA').style.display = "none";
                document.getElementById('optB').style.display = "none";
                return; 
            }
            
            // Wissel de antwoorden af en toe van positie
            let options = [data[idx].a, data[idx].b].sort(() => Math.random() - 0.5);
            
            document.getElementById('quest').innerText = data[idx].q;
            document.getElementById('optA').innerText = options[0];
            document.getElementById('optB').innerText = options[1];
            
            document.getElementById('optA').disabled = false;
            document.getElementById('optB').disabled = false;
            document.getElementById('feedback').innerText = "";
        }

        function answer(elementId) {
            document.getElementById('optA').disabled = true;
            document.getElementById('optB').disabled = true;

            let choice = document.getElementById(elementId).innerText;
            let fb = document.getElementById('feedback');
            
            if(choice === data[idx].correct) { 
                fb.innerText = "Correct! ✨ +10 pts"; 
                fb.style.color = "#10b981"; 
                localScore += 10;
                document.getElementById('score').innerText = localScore;
                if(window.saveScoreToCloud) window.saveScoreToCloud(10);
                idx++;
                setTimeout(load, 2000);
            } else {
                fb.innerText = `Fout! Het was: ${data[idx].correct} ❌ -10 pts`; 
                fb.style.color = "#ef4444";
                localScore = Math.max(0, localScore - 10);
                document.getElementById('score').innerText = localScore;
                if(window.saveScoreToCloud) window.saveScoreToCloud(-10);
                idx++;
                setTimeout(load, 2500);
            }
        }
    </script>
</body>
</html>
