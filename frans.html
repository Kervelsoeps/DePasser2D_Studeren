<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Frans Game - Expert Edition</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #06b6d4; border-radius: 20px; max-width: 650px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(6, 182, 212, 0.3); }
        .grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 20px; }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 18px; border-radius: 14px; cursor: pointer; color: white; font-size: 1.05rem; text-align: left; }
        .box:hover { border-color: #06b6d4; background: #1c1c38; }
    </style>
</head>
<body>
    <a href="index.html" style="color: #6b7280; text-decoration: none; font-weight: bold;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>Défis de Français 🇫🇷 (Expert)</h2>
        <p>Kies de taalkundig of grammaticaal correcte optie:</p>
        <h1 id="target" style="color: #06b6d4; margin: 20px 0; font-size: 1.35rem;"></h1>
        <div class="grid" id="choices"></div>
        <h3 id="feedback" style="margin-top: 25px;"></h3>
    </div>
    
    <script>
        const data = [
            { q: "Vertaal correct (Module 4 - Paramedic): 'Ik heb koorts en ik ben kortademig.'", a: "J'ai de la fièvre et j'ai le souffle court.", f: ["J'ai de la toux et j'ai la gorge irritée.", "Je suis malade et j'ai mal à la tête."] },
            { q: "Welke zin staat correct in de L'imparfait?", a: "Quand j'étais jeune, nous habitions à Bruges.", f: ["Hier, j'ai habité à Bruges avec ma famille.", "Pendant les vacances, nous avons habiter à la mer."] },
            { q: "Geef de correcte L'impératif (bevelsvorm) voor 'Laten we oversteken!':", a: "Traversons la rue !", f: ["Traversez la rue !", "Tu traverses la rue !"] },
            { q: "Vertaal (Module 6 - Routebeschrijving): 'Sla rechtsaf bij het kruispunt en ga rechtdoor.'", a: "Tournez à droite au carrefour et allez tout droit.", f: ["Prenez la première rue à gauche en continuez.", "Passez le pont et tournez à droite."] },
            { q: "Vul aan met het juiste betrekkelijk voornaamwoord: 'Le livre ____ tu m'as donné est mystérieux.'", a: "que", f: ["qui", "dont"] }
        ];
        let cur;

        function load() {
            document.getElementById('feedback').innerText = "";
            document.getElementById('choices').innerHTML = "";
            cur = data[Math.floor(Math.random() * data.length)];
            document.getElementById('target').innerText = cur.q;

            let options = [cur.a, ...cur.f].sort(() => Math.random() - 0.5);
            options.forEach(c => {
                let d = document.createElement('button');
                d.className = 'box';
                d.innerText = c;
                d.onclick = () => {
                    let fb = document.getElementById('feedback');
                    if(c === cur.a) { 
                        fb.innerText = "Excellent ! Jouw Frans is uitstekend. 🌟 +15 pts"; 
                        fb.style.color = "#10b981"; 
                        if(window.saveScoreToCloud) { window.saveScoreToCloud(15); }
                        setTimeout(load, 1800);
                    } else { 
                        fb.innerText = "Attention ! ❌ Dat is grammaticaal incorrect."; 
                        fb.style.color = "#ef4444"; 
                    }
                };
                document.getElementById('choices').appendChild(d);
            });
        }
        load();
    </script>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
