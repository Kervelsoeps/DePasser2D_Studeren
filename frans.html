<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8"><title>Frans Game</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #06b6d4; border-radius: 20px; max-width: 650px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(6, 182, 212, 0.3); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 20px; border-radius: 14px; cursor: pointer; color: white; font-weight: bold; }
        .box:hover { border-color: #06b6d4; background: #1a1a3a; }
    </style>
</head>
<body onload="loadQuestion()">
    <a href="index.html" style="color: #6b7280; text-decoration: none;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>Vocab Klikker 🇫🇷</h2>
        <p style="color: #6b7280;">Lokale Score: <span id="score">0</span> pts</p>
        <p>Vertaal naar het Frans:</p>
        <h1 id="target" style="color: #06b6d4; margin: 20px 0; min-height: 40px;"></h1>
        <div class="grid" id="choices"></div>
        <h3 id="feedback" style="margin-top: 25px; min-height: 30px;"></h3>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script>
        const data = [
            { nl: "Het weer", fr: "La météo", f: ["Le corps", "La ville"] },
            { nl: "De lichaamsdelen", fr: "Les parties du corps", f: ["Le plan", "Être malade"] },
            { nl: "Ziek zijn", fr: "Être malade", f: ["Les premiers secours", "La météo"] },
            { nl: "De hoest", fr: "La toux", f: ["La fièvre", "La gorge"] },
            { nl: "De koorts", fr: "La fièvre", f: ["La toux", "Les maux de tête"] },
            { nl: "Hoofdpijn", fr: "Maux de tête", f: ["Le rhume", "La toux"] },
            { nl: "Kortademig", fr: "Le souffle court", f: ["La gorge irritée", "La fièvre"] },
            { nl: "De mond bedekken", fr: "Se couvrir la bouche", f: ["Se laver les mains", "Nettoyer"] },
            { nl: "De afstand", fr: "La distance", f: ["Le chemin", "Le virage"] },
            { nl: "Rechtdoor gaan", fr: "Aller tout droit", f: ["Tourner à gauche", "Tourner à droite"] },
            { nl: "Links afslaan", fr: "Tourner à gauche", f: ["Aller tout droit", "Traverser"] },
            { nl: "Rechts afslaan", fr: "Tourner à droite", f: ["Tourner à gauche", "Continuer"] },
            { nl: "De straat oversteken", fr: "Traverser la rue", f: ["Suivre la rue", "Prendre le virage"] },
            { nl: "Het pretpark", fr: "Le parc d'attractions", f: ["Le cinéma", "Le zoo"] },
            { nl: "De dierentuin", fr: "Le zoo", f: ["La kermesse", "Le parc"] },
            { nl: "Het zwembad", fr: "La piscine", f: ["La plage", "Le festival"] },
            { nl: "De kermis", fr: "La kermesse", f: ["Le festival", "Le stage"] },
            { nl: "Het treinstation", fr: "La gare", f: ["L'aéroport", "L'arrêt"] }
        ];
        
        let cur;
        let localScore = 0;

        function loadQuestion() {
            document.getElementById('feedback').innerText = "";
            cur = data[Math.floor(Math.random() * data.length)];
            document.getElementById('target').innerText = cur.nl;
            
            let choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = "";
            let allChoices = [cur.fr, ...cur.f].sort(() => Math.random() - 0.5);
            
            allChoices.forEach(choice => {
                let btn = document.createElement('div');
                btn.className = "box";
                btn.innerText = choice;
                btn.onclick = () => check(choice);
                choicesContainer.appendChild(btn);
            });
        }

        function check(c) {
            const boxes = document.querySelectorAll('.box');
            boxes.forEach(b => { b.style.pointerEvents = 'none'; b.style.opacity = '0.5'; });

            let fb = document.getElementById('feedback');
            if(c === cur.fr) { 
                fb.innerText = "Très bien! 🌟 +10 pts"; 
                fb.style.color = "#10b981"; 
                localScore += 10;
                document.getElementById('score').innerText = localScore;
                if(window.saveScoreToCloud) window.saveScoreToCloud(10);
                setTimeout(loadQuestion, 2000);
            } else {
                fb.innerText = `Oeps! Het moest zijn: ${cur.fr} ❌ -10 pts`; 
                fb.style.color = "#ef4444";
                localScore = Math.max(0, localScore - 10);
                document.getElementById('score').innerText = localScore;
                if(window.saveScoreToCloud) window.saveScoreToCloud(-10);
                setTimeout(loadQuestion, 3000);
            }
        }
    </script>
</body>
</html>
