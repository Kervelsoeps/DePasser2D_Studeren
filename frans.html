<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8"><title>Frans Game</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #06b6d4; border-radius: 20px; max-width: 600px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(6, 182, 212, 0.3); }
        .menu-btn { background: #1a1a3a; border: 2px solid #06b6d4; color: white; padding: 15px; margin: 10px; border-radius: 10px; width: 80%; font-size: 1.2rem; cursor: pointer; }
        .menu-btn:hover { background: #06b6d4; color: black; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 20px; border-radius: 14px; cursor: pointer; color: white; font-weight: bold; }
        .box:hover { border-color: #06b6d4; background: #1a1a3a; }
    </style>
</head>
<body>
    <a href="index.html" style="color: #6b7280; text-decoration: none;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>Vocab Klikker 🇫🇷</h2>
        <p style="color: #6b7280;">Lokale Score: <span id="score">0</span> pts</p>
        <hr style="border: 1px solid #2a2a4a; margin: 15px 0;">

        <div id="module-selection">
            <h3>Kies een Audace Module:</h3>
            <button class="menu-btn" onclick="startQuiz('mod4')">🚑 Module 4: Paramedic (Ziek zijn & Lichaam)</button>
            <button class="menu-btn" onclick="startQuiz('mod6')">🗺️ Module 6: S'orienter dans le quartier (Wegwijzers)</button>
        </div>

        <div id="game-screen" style="display: none;">
            <p>Vertaal naar het Frans:</p>
            <h1 id="target" style="color: #06b6d4; margin: 20px 0;"></h1>
            <div class="grid" id="choices"></div>
            <h3 id="feedback" style="margin-top: 25px;"></h3>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script>
        let currentPool = [];
        let cur = {};
        let localScore = 0;

        const dataset = {
            mod4: [
                { nl: "Het weer", fr: "La météo", f: ["Le corps", "La ville"] },
                { nl: "De koorts", fr: "La fièvre", f: ["La toux", "Le plan"] },
                { nl: "Ziek zijn", fr: "Être malade", f: ["Les premiers secours", "Le rhume"] },
                { nl: "De hoest", fr: "La toux", f: ["La fièvre", "Le bras"] }
            ],
            mod6: [
                { nl: "De stadskaart", fr: "Le plan de ville", f: ["La météo", "L'hôpital"] },
                { nl: "De afstand", fr: "La distance", f: ["Le virage", "Le feu rouge"] },
                { nl: "Rechtdoor gaan", fr: "Aller tout droit", f: ["Tourner à gauche", "Traverser"] }
            ]
        };

        function startQuiz(mod) {
            currentPool = dataset[mod];
            document.getElementById('module-selection').style.display = "none";
            document.getElementById('game-screen').style.display = "block";
            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('feedback').innerText = "";
            cur = currentPool[Math.floor(Math.random() * currentPool.length)];
            document.getElementById('target').innerText = cur.nl;
            
            let choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = "";
            let allChoices = [cur.fr, ...cur.f].sort(() => Math.random() - 0.5);
            
            allChoices.forEach(choice => {
                let btn = document.createElement('div');
                btn.className = "box";
                btn.innerText = choice;
                btn.onclick = () => check(choice);
                choicesContainer.appendChild(btn);
            });
        }

        function check(c) {
            const boxes = document.querySelectorAll('.box');
            boxes.forEach(b => { b.style.pointerEvents = 'none'; b.style.opacity = '0.5'; });

            let fb = document.getElementById('feedback');
            if(c === cur.fr) { 
                fb.innerText = "Très bien! 🌟 +10 pts"; 
                fb.style.color = "#10b981"; 
                localScore += 10;
                document.getElementById('score').innerText = localScore;
                if(window.saveScoreToCloud) window.saveScoreToCloud(10);
                setTimeout(loadQuestion, 2000);
            } else {
                fb.innerText = `Oeps! Het moest zijn: ${cur.fr} ❌ -10 pts`; 
                fb.style.color = "#ef4444";
                localScore = Math.max(0, localScore - 10);
                document.getElementById('score').innerText = localScore;
                if(window.saveScoreToCloud) window.saveScoreToCloud(-10);
                setTimeout(loadQuestion, 2500);
            }
        }
    </script>
</body>
</html>
