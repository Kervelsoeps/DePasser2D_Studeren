<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Frans Game - Examen Juni 2026</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #06b6d4; border-radius: 20px; max-width: 700px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(6, 182, 212, 0.3); }
        .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 16px; border-radius: 14px; cursor: pointer; color: white; font-size: 1.05rem; text-align: left; }
        .box:hover { border-color: #06b6d4; background: #1c1c38; }
        .badge { background: #06b6d4; color: #000; padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; vertical-align: middle; margin-left: 10px; }
    </style>
</head>
<body>
    <a href="index.html" style="color: #6b7280; text-decoration: none; font-weight: bold;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>Examen Trainer Frans 🇫🇷</h2>
        <p>Beantwoord de vraag over de officiële examenstof (Modules 4, 5, 6 & 7):</p>
        <h3 id="topic" style="color: #9ca3af; margin-top: 10px;"></h3>
        <h1 id="target" style="color: #06b6d4; margin: 15px 0; font-size: 1.3rem;"></h1>
        <div class="grid" id="choices"></div>
        <h3 id="feedback" style="margin-top: 25px;"></h3>
    </div>
    
    <script>
        const data = [
            // Module 4: Paramedic & Être malade
            { t: "Vocabulaire: Être malade", q: "Vertaal correct: 'Ik ben verkouden en ik heb keelijn.'", a: "Je suis enrhumé et j'ai mal à la gorge.", f: ["Je suis blessé et j'ai mal au cœur.", "J'ai la grippe et j'ai de la fièvre."] },
            { t: "Vocabulaire: Les premiers secours", q: "Wat betekent 'appeler les secours'?", a: "de hulpdiensten bellen", f: ["een pleister plakken", "het slachtoffer reanimeren"] },
            { t: "Vocabulaire: Les parties du corps", q: "Welk lichaamsdeel is 'de enkel'?", a: "la cheville", f: ["le poignet", "le genou"] },
            
            // Module 6: S'orienter dans le quartier
            { t: "Vocabulaire: Le plan de ville", q: "Hoe zeg je: 'Sla de eerste straat links af bij het stoplicht'?", a: "Prenez la première rue à gauche au feu de signalisation.", f: ["Tournez à droite après le rond-point.", "Continuez tout droit jusqu'au carrefour."] },
            { t: "Vocabulaire: Les magasins et bâtiments", q: "Vertaal: 'het gemeentehuis' en 'de apotheek'", a: "la mairie et la pharmacie", f: ["la gare et la bibliothèque", "l'église et la boucherie"] },
            
            // Module 7: La météo & Les saisons
            { t: "Vocabulaire: La météo", q: "Hoe zeg je: 'Het bliksemt en het stormt'?", a: "Il y a des éclairs et il y a une tempête.", f: ["Il fait du brouillard et il gèle.", "Il y a des nuages et il pleut."] },
            
            // Grammaire: Tijden en werkwoorden (Module 7 & Boussole)
            { t: "Grammaire: L'imparfait vs Passé Composé", q: "Kies de juiste vormen: 'Hier, je (regarder) ____ la télé quand soudain le téléphone (sonner) ____.'", a: "regardais / a sonné", f: ["ai regardé / sonnait", "regardais / sonnait"] },
            { t: "Grammaire: L'impératif (Bevelsvorm)", q: "Wat is de correcte bevelsvorm van 'faire' voor 'jullie' (vous)?", a: "Faites !", f: ["Faisons !", "Faites-vous !"] },
            { t: "Grammaire: L'indicatif présent", q: "Wat is de juiste vorm van het werkwoord 'choisir' bij 'nous'?", a: "nous choisissons", f: ["nous choisissons", "nous choisissons", "nous choisissons"] }, // we filteren dubbelingen eruit, dus we maken unieke foutes:
            { t: "Grammaire: L'indicatif présent", q: "Wat is de juiste tegenwoordige tijd van 'prendre' bij 'ils'?", a: "ils prennent", f: ["ils prendent", "ils prennet"] },
            { t: "Grammaire: Le passé composé", q: "Welke zin is correct met het hulpwerkwoord 'être'?", a: "Elle est allée à la gare.", f: ["Elle a allé à la gare.", "Elle est allé à la gare."] }
        ];
        let cur;

        function load() {
            document.getElementById('feedback').innerText = "";
            document.getElementById('choices').innerHTML = "";
            cur = data[Math.floor(Math.random() * data.length)];
            document.getElementById('topic').innerHTML = `Onderdeel: <span class="badge">${cur.t}</span>`;
            document.getElementById('target').innerText = cur.q;

            let options = [cur.a, ...cur.f].sort(() => Math.random() - 0.5);
            options.forEach(c => {
                let d = document.createElement('button');
                d.className = 'box';
                d.innerText = c;
                d.onclick = () => {
                    let fb = document.getElementById('feedback');
                    if(c === cur.a) { 
                        fb.innerText = "Excellent ! Dit beheers je perfect voor het examen. 🌟 +15 pts"; 
                        fb.style.color = "#10b981"; 
                        if(window.saveScoreToCloud) { window.saveScoreToCloud(15); }
                        setTimeout(load, 1800);
                    } else { 
                        fb.innerText = "Attention ! ❌ Kijk dit onderdeel nog eens na in je cursus of op Polpo."; 
                        fb.style.color = "#ef4444"; 
                    }
                };
                document.getElementById('choices').appendChild(d);
            });
        }
        load();
    </script>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
