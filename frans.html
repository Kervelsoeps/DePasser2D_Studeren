<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Frans Game</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #06b6d4; border-radius: 20px; max-width: 600px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(6, 182, 212, 0.3); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 20px; border-radius: 14px; cursor: pointer; color: white; font-size: 1.1rem; }
        .box:hover { border-color: #06b6d4; background: #1c1c38; }
    </style>
</head>
<body>
    <a href="index.html" style="color: #6b7280; text-decoration: none; font-weight: bold;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>Vocab Klikker 🌦</h2>
        <p>Vertaal naar het Frans:</p>
        <h1 id="target" style="color: #06b6d4; margin: 20px 0;"></h1>
        <div class="grid" id="choices"></div>
        <h3 id="feedback" style="margin-top: 25px;"></h3>
    </div>
    
    <script>
        const data = [
            { nl: "Het weer", fr: "La météo", f: ["Le corps", "La ville"] },
            { nl: "De lichaamsdelen", fr: "Les parties du corps", f: ["Le plan", "Être malade"] },
            { nl: "Ziek zijn", fr: "Être malade", f: ["Les premiers secours", "La météo"] },
            { nl: "De seizoenen", fr: "Les saisons", f: ["Les magasins", "L'impératif"] },
            { nl: "De winkels en gebouwen", fr: "Les magasins et les bâtiments", f: ["Le plan de ville", "Les premiers secours"] }
        ];
        let cur;

        function load() {
            document.getElementById('feedback').innerText = "";
            document.getElementById('choices').innerHTML = "";
            cur = data[Math.floor(Math.random() * data.length)];
            document.getElementById('target').innerText = cur.nl;

            let options = [cur.fr, ...cur.f].sort(() => Math.random() - 0.5);
            options.forEach(c => {
                let d = document.createElement('button');
                d.className = 'box';
                d.innerText = c;
                d.onclick = () => {
                    let fb = document.getElementById('feedback');
                    if(c === cur.fr) { 
                        fb.innerText = "Très bien! 🌟 +10 pts"; 
                        fb.style.color = "#10b981"; 
                        if(window.saveScoreToCloud) { window.saveScoreToCloud(10); }
                        setTimeout(load, 1500);
                    } else { 
                        fb.innerText = "Fout! ❌ Probeer het nog eens."; 
                        fb.style.color = "#ef4444"; 
                    }
                };
                document.getElementById('choices').appendChild(d);
            });
        }
        load();
    </script>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
