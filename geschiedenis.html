<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Geschiedenis Game - Volledige Examenstof</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #eab308; border-radius: 20px; max-width: 750px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(234, 179, 8, 0.3); }
        .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 16px; border-radius: 14px; cursor: pointer; color: white; font-size: 1.05rem; text-align: left; }
        .box:hover { border-color: #eab308; background: #1c1c38; }
        .badge { background: #eab308; color: #000; padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>
    <a href="index.html" style="color: #6b7280; text-decoration: none; font-weight: bold;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>Geschiedenis Sorter & Quiz 📜</h2>
        <p>Analyseer de historische bron of historische context over Thema 4 (De Romeinen):</p>
        <h3 id="topic" style="color: #9ca3af; margin-top: 10px;"></h3>
        <h1 id="target" style="font-size: 1.2-rem; font-weight: bold; margin: 15px 0; color: #eab308;"></h1>
        <div class="grid" id="choices"></div>
        <h3 id="feedback" style="margin-top: 20px;"></h3>
    </div>

    <script>
        const data = [
            { t: "Kritiek van de bron", q: "Wat is een PRIMAIRE historische bron?", a: "Een bron die rechtstreeks afkomstig is uit de tijd waarover men informatie zoekt.", f: ["Een modern geschiedenisboek dat de feiten achteraf reconstrueert.", "Een nagespeelde documentaire op televisie."] },
            { t: "Maatschappelijke domeinen", q: "Onder welk maatschappelijk domein valt het feit dat slaven moesten zwoegen op de landerijen van rijke patriciërs?", a: "Sociaal", f: ["Politiek", "Cultureel"] },
            { t: "Maatschappelijke domeinen", q: "Tot welk domein hoort het muntsysteem (denarii) en de handel op het Forum Romanum?", a: "Economisch", f: ["Politiek", "Sociaal"] },
            { t: "Thema 4: De Romeinen bij ons", q: "Hoe is de huidige taalgrens in België historisch ontstaan volgens de cursus?", a: "Door de vestiging van de Germaanse Franken ten noorden van de Romeinse heirbanen (limes) na de val van de grensverdediging.", f: ["Julius Caesar heeft die grens persoonlijk getrokken via een decreet.", "Door een natuurlijke splitsing van rivieren in de middeleeuwen."] },
            { t: "Tijdsbegrip", q: "Als een cultuuruiting eeuwenlang onveranderd blijft bestaan, spreken historici van...", a: "Continuïteit", f: ["Evolutie", "Verandering"] },
            { t: "Historische onderzoeksvraag", q: "Aan welke 3 criteria moet een goede historische onderzoeksvraag voldoen?", a: "Duidelijk/afgebakend, relevant en controleerbaar (onderzoekbaar).", f: ["Lang, complex en grappig.", "Geschreven, materieel en visueel."] }
        ];
        let cur;

        function load() {
            document.getElementById('feedback').innerText = "";
            document.getElementById('choices').innerHTML = "";
            cur = data[Math.floor(Math.random() * data.length)];
            document.getElementById('topic').innerHTML = `Onderdeel: <span class="badge">${cur.t}</span>`;
            document.getElementById('target').innerText = cur.q;

            let options = [cur.a, ...cur.f].sort(() => Math.random() - 0.5);
            options.forEach(c => {
                let d = document.createElement('button');
                d.className = 'box';
                d.innerText = c;
                d.onclick = () => {
                    let fb = document.getElementById('feedback');
                    if(c === cur.a) { 
                        fb.innerText = "Historisch correct! 👑 +15 pts"; 
                        fb.style.color = "#10b981"; 
                        if(window.saveScoreToCloud) { window.saveScoreToCloud(15); }
                        setTimeout(load, 1500);
                    } else { 
                        fb.innerText = "Oeps! Dat klopt helaas niet. Kijk de woordenlijst achteraan in je boek na."; 
                        fb.style.color = "#ef4444"; 
                    }
                };
                document.getElementById('choices').appendChild(d);
            });
        }
        load();
    </script>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
