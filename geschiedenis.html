<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geschiedenis Arcade Game</title>
    <style>
        :root {
            --bg-dark: #0a0a12;
            --card-bg: #141423;
            --neon-yellow: #eab308;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

        body { 
            background: var(--bg-dark); 
            color: var(--text-main); 
            text-align: center; 
            padding: 40px; 
            background-image: radial-gradient(circle at 50% 10%, #2e2509 0%, var(--bg-dark) 70%);
            min-height: 100vh;
        }

        .back-btn { 
            display: inline-block; \
            margin-bottom: 25px; 
            color: var(--text-muted); 
            text-decoration: none; 
            font-weight: bold;
            border: 1px solid #3b3b68;
            padding: 8px 16px;
            border-radius: 8px;
        }
        .back-btn:hover { border-color: var(--neon-yellow); color: #fff; }

        .arcade { background: var(--card-bg); border: 3px solid var(--neon-yellow); border-radius: 20px; max-width: 600px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(234, 179, 8, 0.3); }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 15px; border-radius: 10px; cursor: pointer; margin: 10px; display: inline-block; width: 42%; color: #fff; font-weight: bold; transition: 0.2s; }
        .box:hover { border-color: var(--neon-yellow); background: #1a1a3a; }
        
        .score-container { font-size: 1.2rem; margin-bottom: 15px; color: var(--text-muted); }
        #score { color: var(--neon-yellow); font-weight: bold; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">⬅ Dashboard</a>
    <div class="arcade">
        <h2>Maatschappelijk Domein Sorter 📜</h2>
        <div class="score-container">Huidige sessie score: <span id="score">0</span> pts</div>
        <p id="target" style="font-size: 1.2rem; margin: 20px 0; color: #eab308; font-weight: bold; min-height: 60px;"></p>
        
        <div class="box" onclick="check('Politiek')">👑 Politiek</div>
        <div class="box" onclick="check('Economisch')">🌾 Economisch</div>
        <div class="box" onclick="check('Sociaal')">👥 Sociaal</div>
        <div class="box" onclick="check('Cultureel')">🎨 Cultureel</div>
        
        <h3 id="feedback" style="margin-top: 20px; min-height: 30px;"></h3>
    </div>

    <script>
        let cur;
        let score = 0;

        const data = [
            { b: "Romeinse handelaren die amforen met olijfolie verkopen op het forum.", d: "Economisch" },
            { b: "De verovering van Gallië door het machtige leger van Julius Caesar.", d: "Politiek" },
            { b: "Slaven die moeten zwoegen op de landerijen van een rijke Romeinse grootgrondbezitter.", d: "Sociaal" },
            { b: "Het ontstaan van de Latijnse taal en de taalgrens in België.", d: "Cultureel" }
        ];

        function loadQuestion() {
            document.getElementById('feedback').innerText = "";
            cur = data[Math.floor(Math.random() * data.length)];
            document.getElementById('target').innerText = cur.b;
        }

        function check(choice) {
            let fb = document.getElementById('feedback');
            
            // Blokkeer extra klikken tijdens het tonen van feedback
            if (fb.innerText !== "") return;

            if (choice === cur.d) {
                score += 10;
                if(document.getElementById('score')) document.getElementById('score').innerText = score;
                fb.innerText = "Historisch correct! 👑 +10 punten";
                fb.style.color = "var(--neon-green)";

                if(window.saveScoreToCloud) {
                    window.saveScoreToCloud(10);
                }
            } else {
                score -= 10; // Trek direct 10 punten af
                if(document.getElementById('score')) document.getElementById('score').innerText = score;
                fb.innerText = `Oeps! Dat hoort bij ${cur.d}. ❌ Min 10 punten!`;
                fb.style.color = "var(--neon-red)";

                if(window.saveScoreToCloud) {
                    window.saveScoreToCloud(-10);
                }
            }
            // Direct door naar de volgende vraag na 1,5 seconde, geen herkansing!
            setTimeout(loadQuestion, 1500);
        }

        window.onload = loadQuestion;
    </script>
</body>
</html>
