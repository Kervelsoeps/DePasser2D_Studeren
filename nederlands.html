<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Nederlands Game - Volledige Examenstof</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #3b82f6; border-radius: 20px; max-width: 750px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(59, 130, 246, 0.3); }
        .grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 20px; }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 16px; border-radius: 14px; cursor: pointer; color: white; font-size: 1.05rem; text-align: left; }
        .box:hover { border-color: #3b82f6; background: #1c1c38; }
        .badge { background: #3b82f6; color: #fff; padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>
    <a href="index.html" style="color: #6b7280; text-decoration: none; font-weight: bold;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>Examen Trainer Nederlands 🇳🇱</h2>
        <p>Analyseer de taalkundige kwestie gebaseerd op Campus 2:</p>
        <h3 id="topic" style="color: #9ca3af; margin-top: 10px;"></h3>
        <h1 id="target" style="font-size: 1.2rem; font-weight: bold; margin: 15px 0; color: #3b82f6;"></h1>
        <div class="grid" id="choices"></div>
        <h3 id="feedback" style="margin-top: 20px;"></h3>
    </div>

    <script>
        const data = [
            { t: "Les 28/37: Woordtekens & Koppelteken", q: "Kies de zin met de volledig correcte spelling van de samenstelling:", a: "De auto-industrie maakte een reuzensprong dankzij de nieuwe twee-en-twintigjarige ingenieur.", f: ["De autoindustrie maakte een reuzensprong.", "De auto-industrie maakte een reuzensprong dankzij de tweeëntwintig-jarige ingenieur."] },
            { t: "Les 28: Trema", q: "Wat is de juiste spelling van het meervoud van 'kopie' en het woord 'ruine'?", a: "kopieën en ruïne", f: ["kopieen en ruine", "kopie-en en ruïnes"] },
            { t: "Les 22: Actief en Passief", q: "Zet om naar een passieve (lijdende) zin: 'De directie zal morgen de examenresultaten bekendmaken.'", a: "De examenresultaten zullen morgen door de directie bekendgemaakt worden.", f: ["De examenresultaten worden morgen door de directie bekendgemaakt.", "De directie laat morgen de examenresultaten bekendmaken."] },
            { t: "Les 21: Oorzaak en gevolg", q: "Wat is het GEVOLG in deze zin: 'Doordat de hoofdlaborant een rekenfout maakte, mislukte het experiment.'", a: "Het mislukken van het experiment.", f: ["Het maken van een rekenfout door de hoofdlaborant.", "Het feit dat het om een experiment ging."] },
            { t: "Les 35: Zinsstructuur", q: "Welke stelling klopt over: 'Toen de bel ging, stormden de leerlingen naar buiten, maar de leraar bleef rustig zitten.'", a: "Het is een samengestelde zin met twee hoofdzinnen en één bijzin.", f: ["Het is een enkelvoudige zin.", "Het is een samengestelde zin die enkel uit hoofdzinnen bestaat."] },
            { t: "Les 32: Voornaamwoorden", q: "In de zin: 'Wie heeft hen dat gegeven?', wat voor soort voornaamwoorden zijn 'Wie' en 'hen'?", a: "Wie = vragend voornaamwoord, hen = persoonlijk voornaamwoord", f: ["Wie = betrekkelijk voornaamwoord, hen = bezittelijk voornaamwoord", "Wie = vragend voornaamwoord, hen = aanwijzend voornaamwoord"] },
            { t: "Les 45: Zinsdelen", q: "Wat is de functie van 'de winnaar' in: 'De jury overhandigde de gouden medaille aan de winnaar.'?", a: "Meewerkend voorwerp", f: ["Lijdend voorwerp", "Voorzetselvoorwerp"] },
            { t: "Les 45: Zinsdelen", q: "Wat is het voorzetselvoorwerp (VZV) in: 'Zij twijfelde al weken aan de juistheid van die bron.'?", a: "aan de juistheid van die bron", f: ["al weken", "Zij"] },
            { t: "Les 1: Woordenschat en begrippen", q: "Wat is grafologie en waarom noemen we het een 'pseudowetenschap'?", a: "Handschriftkunde; het beweert wetenschappelijk te zijn maar mist objectief bewijs.", f: ["De studie van grafieken; het gebruikt geen wiskunde.", "Een middeleeuwse taal; het wordt niet meer gesproken."] },
            { t: "Les 1: Bullet Journal", q: "Wat betekenen de termen 'index' en 'keys' in een bujo?", a: "Index = de inhoudsopgave, Keys = de gebruikte symbolen/codes", f: ["Index = de dagpagina, Keys = de motivatiequotes", "Index = de paginanummers, Keys = de wekelijkse doelen"] }
        ];
        let cur;

        function load() {
            document.getElementById('feedback').innerText = "";
            document.getElementById('choices').innerHTML = "";
            cur = data[Math.floor(Math.random() * data.length)];
            document.getElementById('topic').innerHTML = `Onderdeel: <span class="badge">${cur.t}</span>`;
            document.getElementById('target').innerText = cur.q;

            let options = [cur.a, ...cur.f].sort(() => Math.random() - 0.5);
            options.forEach(c => {
                let d = document.createElement('button');
                d.className = 'box';
                d.innerText = c;
                d.onclick = () => {
                    let fb = document.getElementById('feedback');
                    if(c === cur.a) { 
                        fb.innerText = "Feilloos! Jij bent helemaal klaar voor het examen Nederlands. 👑 +15 pts"; 
                        fb.style.color = "#10b981"; 
                        if(window.saveScoreToCloud) { window.saveScoreToCloud(15); }
                        setTimeout(load, 1500);
                    } else { 
                        fb.innerText = "Oeps! ❌ Dit zinsdeel of deze regel klopt niet. Kijk het na in Campus 2."; 
                        fb.style.color = "#ef4444"; 
                    }
                };
                document.getElementById('choices').appendChild(d);
            });
        }
        load();
    </script>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
