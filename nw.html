<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8"><title>Natuurwetenschappen Game</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #a78bfa; border-radius: 20px; max-width: 600px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(167, 139, 250, 0.3); }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 15px; border-radius: 10px; cursor: pointer; margin: 10px; display: inline-block; width: 45%; color: white; font-weight: bold; }
        .box:hover { border-color: #a78bfa; }
    </style>
</head>
<body onload="loadQuestion()">
    <a href="index.html" style="color: #6b7280; text-decoration: none;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>Dichtheid Sorter 🧪</h2>
        <p style="color: #6b7280;">Lokale Score: <span id="score">0</span> pts</p>
        <p id="target" style="font-size: 1.2rem; margin: 20px 0; font-weight: bold; color: #a78bfa; min-height: 50px;"></p>
        <div class="box btn-nw" onclick="check('Massa')">⚖️ Massa</div>
        <div class="box btn-nw" onclick="check('Volume')">🧪 Volume</div>
        <div class="box btn-nw" onclick="check('Dichtheid')">⚗️ Massadichtheid</div>
        <div class="box btn-nw" onclick="check('Stofkenmerk')">💎 Stofkenmerk</div>
        <h3 id="feedback" style="margin-top: 20px; min-height: 30px;"></h3>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script>
        const data = [
            { b: "De hoeveelheid materie waaruit een voorwerp bestaat.", d: "Massa" },
            { b: "De ruimte die een voorwerp of stof inneemt.", d: "Volume" },
            { b: "De massa per volumeeenheid van een zuivere stof (formule: m / V).", d: "Dichtheid" },
            { b: "Een basiseenheid uitgedrukt in kilogram (kg) of gram (g).", d: "Massa" },
            { b: "Een maateenheid uitgedrukt in liter (L) of kubieke centimeter (cm³).", d: "Volume" },
            { b: "Een eenheid uitgedrukt in g/cm³ of kg/m³.", d: "Dichtheid" },
            { b: "Een voorwerp met massa 20g en volume 10cm³ heeft een waarde van 2 g/cm³.", d: "Dichtheid" },
            { b: "Dit meet je nauwkeurig met een elektronische balans.", d: "Massa" },
            { b: "Dit meet je in het labo met een maatcilinder of buret.", d: "Volume" },
            { b: "Kookpunt, smeltpunt en dichtheid zijn voorbeelden van een...", d: "Stofkenmerk" },
            { b: "Water heeft bij kamertemperatuur een waarde van exact 1 g/cm³.", d: "Dichtheid" },
            { b: "Olie blijft drijven op water omdat het een lagere ... heeft.", d: "Dichtheid" },
            { b: "Een blok puur goud zinkt snel omdat het een zeer hoge ... heeft.", d: "Dichtheid" },
            { b: "Een maatbeker gevuld tot de streep van 250 milliliter.", d: "Volume" },
            { b: "Een object weegt precies 1,5 kilogram op de weegschaal.", d: "Massa" },
            { b: "De eigenschap waarmee je een zuivere stof kunt herkennen.", d: "Stofkenmerk" }
        ];
        let cur;
        let localScore = 0;

        function loadQuestion() {
            document.getElementById('feedback').innerText = "";
            const boxes = document.querySelectorAll('.btn-nw');
            boxes.forEach(b => { b.style.pointerEvents = 'auto'; b.style.opacity = '1'; });
            
            cur = data[Math.floor(Math.random() * data.length)];
            document.getElementById('target').innerText = cur.b;
        }

        function check(choice) {
            const boxes = document.querySelectorAll('.btn-nw');
            boxes.forEach(b => { b.style.pointerEvents = 'none'; b.style.opacity = '0.5'; });

            let fb = document.getElementById('feedback');
            if (choice === cur.d) {
                localScore += 10;
                document.getElementById('score').innerText = localScore;
                fb.innerText = "Superwetenschappelijk! 🧪 +10 pts";
                fb.style.color = "#10b981";
                if(window.saveScoreToCloud) window.saveScoreToCloud(10);
                setTimeout(loadQuestion, 2000);
            } else {
                fb.innerText = `Oeps! Dat hoort bij ${cur.d}. ❌ -10 pts`;
                fb.style.color = "#ef4444";
                localScore = Math.max(0, localScore - 10);
                document.getElementById('score').innerText = localScore;
                if(window.saveScoreToCloud) window.saveScoreToCloud(-10);
                setTimeout(loadQuestion, 3000);
            }
        }
    </script>
</body>
</html>
