<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8"><title>Natuurwetenschappen Game</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #a78bfa; border-radius: 20px; max-width: 600px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(167, 139, 250, 0.3); }
        .menu-btn { background: #1a1a3a; border: 2px solid #a78bfa; color: white; padding: 15px; margin: 10px; border-radius: 10px; width: 80%; font-size: 1.2rem; cursor: pointer; }
        .menu-btn:hover { background: #a78bfa; color: black; font-weight: bold; }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 15px; border-radius: 10px; cursor: pointer; margin: 10px; display: inline-block; width: 45%; color: white; font-weight: bold; }
        .box:hover { border-color: #a78bfa; }
    </style>
</head>
<body>
    <a href="index.html" style="color: #6b7280; text-decoration: none;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>Wetenschappen Quiz 🧪</h2>
        <p style="color: #6b7280;">Lokale Score: <span id="score">0</span> pts</p>
        <hr style="border: 1px solid #2a2a4a; margin: 15px 0;">

        <div id="module-selection">
            <h3>Kies een Wetenschappelijk Thema:</h3>
            <button class="menu-btn" onclick="startQuiz('dichtheid')">⚖️ Thema: Massadichtheid (Formules)</button>
            <button class="menu-btn" onclick="startQuiz('krachten')">🏹 Thema: Krachten & Dynamometer</button>
        </div>

        <div id="game-screen" style="display: none;">
            <p id="target" style="font-size: 1.2rem; margin: 20px 0; font-weight: bold; color: #a78bfa;"></p>
            <div id="choices"></div>
            <h3 id="feedback" style="margin-top: 20px;"></h3>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script>
        let currentPool = [];
        let cur = {};
        let localScore = 0;

        const dataset = {
            dichtheid: [
                { q: "Wat is de formule voor massadichtheid?", a: "ρ = m / V", f: ["ρ = m * V", "ρ = V / m"] },
                { q: "Is massadichtheid een stofeigenschap?", a: "Ja", f: ["Nee"] }
            ],
            krachten: [
                { q: "Wat meet je met een dynamometer?", a: "Kracht (N)", f: ["Massa (kg)", "Volume (L)"] },
                { q: "Wat is de eenheid van kracht?", a: "Newton (N)", f: ["Kilogram (kg)", "Joule (J)"] }
            ]
        };

        function startQuiz(thema) {
            currentPool = dataset[thema];
            document.getElementById('module-selection').style.display = "none";
            document.getElementById('game-screen').style.display = "block";
            loadQuestion();
        }

        function loadQuestion() {
            document.getElementById('feedback').innerText = "";
            cur = currentPool[Math.floor(Math.random() * currentPool.length)];
            document.getElementById('target').innerText = cur.q;
            
            let choicesContainer = document.getElementById('choices');
            choicesContainer.innerHTML = "";
            let allChoices = [cur.a, ...cur.f].sort(() => Math.random() - 0.5);
            
            allChoices.forEach(choice => {
                let btn = document.createElement('div');
                btn.className = "box";
                btn.innerText = choice;
                btn.onclick = () => check(choice);
                choicesContainer.appendChild(btn);
            });
        }

        function check(choice) {
            const boxes = document.querySelectorAll('.box');
            boxes.forEach(b => { b.style.pointerEvents = 'none'; b.style.opacity = '0.5'; });

            let fb = document.getElementById('feedback');
            if (choice === cur.a) {
                localScore += 10;
                document.getElementById('score').innerText = localScore;
                fb.innerText = "Superwetenschappelijk! 🧪 +10 pts";
                fb.style.color = "#10b981";
                if(window.saveScoreToCloud) window.saveScoreToCloud(10);
                setTimeout(loadQuestion, 2000);
            } else {
                fb.innerText = `Oeps! Dat klopt niet. ❌ -10 pts`;
                fb.style.color = "#ef4444";
                localScore = Math.max(0, localScore - 10);
                document.getElementById('score').innerText = localScore;
                if(window.saveScoreToCloud) window.saveScoreToCloud(-10);
                setTimeout(loadQuestion, 2500);
            }
        }
    </script>
</body>
</html>
