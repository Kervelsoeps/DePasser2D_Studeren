<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Natuurwetenschappen Game</title>
    <style>
        body { background: #0a0a12; color: #fff; font-family: sans-serif; text-align: center; padding: 40px; }
        .arcade { background: #141423; border: 3px solid #ec4899; border-radius: 20px; max-width: 600px; margin: 0 auto; padding: 30px; box-shadow: 0 0 30px rgba(236, 72, 153, 0.3); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .box { background: #111122; border: 2px solid #2a2a4a; padding: 20px; border-radius: 14px; cursor: pointer; color: white; font-size: 1.1rem; }
        .box:hover { border-color: #ec4899; background: #1c1c38; }
    </style>
</head>
<body>
    <a href="index.html" style="color: #6b7280; text-decoration: none; font-weight: bold;">⬅ Dashboard</a>
    <div class="arcade" style="margin-top: 25px;">
        <h2>Massa & Dichtheid Klikker 🧪</h2>
        <p>Kies het juiste antwoord:</p>
        <h1 id="target" style="color: #ec4899; margin: 20px 0; font-size: 1.5rem;"></h1>
        <div class="grid" id="choices"></div>
        <h3 id="feedback" style="margin-top: 25px;"></h3>
    </div>
    
    <script>
        const data = [
            { q: "Wat is de juiste formule voor massadichtheid?", a: "p = m / V", f: ["p = m * V", "p = V / m"] },
            { q: "Wat verandert er NOOIT, waar je ook bent in het heelal?", a: "De massa", f: ["Het gewicht", "De zwaartekracht"] },
            { q: "Met welk meettoestel bepaal je nauwkeurig de massa van een object?", a: "Balans / Weegschaal", f: ["Maatcilinder", "Dynamometer"] },
            { q: "Welke eenheid hoort officieel bij massadichtheid?", a: "g/cm³ of kg/m³", f: ["kg/Ltr", "g/mm"] }
        ];
        let cur;

        function load() {
            document.getElementById('feedback').innerText = "";
            document.getElementById('choices').innerHTML = "";
            cur = data[Math.floor(Math.random() * data.length)];
            document.getElementById('target').innerText = cur.q;

            let options = [cur.a, ...cur.f].sort(() => Math.random() - 0.5);
            options.forEach(c => {
                let d = document.createElement('button');
                d.className = 'box';
                d.innerText = c;
                d.onclick = () => {
                    let fb = document.getElementById('feedback');
                    if(c === cur.a) { 
                        fb.innerText = "Super! Wetenschappelijk correct. ✨ +10 pts"; 
                        fb.style.color = "#10b981"; 
                        if(window.saveScoreToCloud) { window.saveScoreToCloud(10); }
                        setTimeout(load, 1500);
                    } else { 
                        fb.innerText = "Fout! ❌ Denk aan de formule."; 
                        fb.style.color = "#ef4444"; 
                    }
                };
                document.getElementById('choices').appendChild(d);
            });
        }
        load();
    </script>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
